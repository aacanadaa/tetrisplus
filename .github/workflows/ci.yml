name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Nothing here writes to the repository, so the token only needs read access.
# That is also what a pull request from a fork gets, which is the point: an
# outside contribution is tested without being trusted.
permissions:
  contents: read

# A new push to the same branch makes the previous run obsolete.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev python3-venv

      # -Werror is the point: a warning must fail the build rather than scroll
      # past in a log nobody reads.
      - name: Compile clean under -Wall -Wextra
        run: gcc -O2 -Wall -Wextra -Werror tetris.c -o /tmp/tetris -lncurses

      # The README advertises macOS and the BSDs, and only Linux is tested, so
      # this compile is the only guard against a GNU extension creeping in.
      - name: Compile as strict POSIX
        run: |
          gcc -std=c99 -D_POSIX_C_SOURCE=200809L -O2 -Wall -Wextra -Werror \
            tetris.c -o /tmp/tetris-posix -lncurses

      - name: Run the pty test suite
        run: ./tests/run_tests.sh

      # Rebuilds the same binaries instrumented and re-runs all three suites.
      # Depends on the previous step having populated the scratch directory.
      - name: Run the pty test suite under ASan + UBSan
        run: ./tests/run_sanitizers.sh

  packaging:
    name: Installers and package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential libncurses-dev

      - name: install.sh installs and uninstalls
        run: |
          ./install.sh --user
          test -x "$HOME/.local/bin/tetrisplus"
          export PATH="$HOME/.local/bin:$PATH"
          command -v tetrisplus
          ./install.sh --user --uninstall
          test ! -e "$HOME/.local/bin/tetrisplus"

      - name: build-deb.sh produces a valid package
        run: |
          ./build-deb.sh
          dpkg-deb --info dist/tetrisplus_*_amd64.deb
          dpkg-deb --contents dist/tetrisplus_*_amd64.deb

      - name: the packaged binary and man page are real
        run: |
          dpkg-deb -x dist/tetrisplus_*_amd64.deb /tmp/deb
          file /tmp/deb/usr/bin/tetrisplus | grep -q ELF
          test -s /tmp/deb/usr/share/man/man6/tetrisplus.6.gz

  # The README advertises macOS and Windows, and Linux is the only platform the
  # local pty suite can cover on its own, so these jobs are the only place the
  # other two are compiled. On macOS the pty suite runs for real; on Windows a
  # clean compile plus install/uninstall is as far as a headless runner goes.
  macos:
    name: Build and test on macOS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      # Same warning gate as Linux: a warning fails the build rather than
      # scrolling past. gcc here is Apple's clang, -lncurses is in the SDK.
      - name: Compile clean under -Wall -Wextra
        run: gcc -O2 -Wall -Wextra -Werror tetris.c -o /tmp/tetris -lncurses

      - name: Run the pty test suite
        run: ./tests/run_tests.sh

  windows:
    name: Build on Windows
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v5

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-pdcurses
            zip

      - name: Compile clean under -Wall -Wextra
        run: |
          gcc -O2 -Wall -Wextra -Werror tetris.c -o tetrisplus.exe \
            -static -lpdcurses -lwinmm

      - name: build-windows.sh produces an archive
        run: |
          ./build-windows.sh
          ls -la dist/
          test -s dist/tetrisplus_*_windows_*.zip

      - name: install.sh installs and uninstalls
        run: |
          ./install.sh --user
          test -x "$HOME/.local/bin/tetrisplus.exe"
          ./install.sh --user --uninstall
          test ! -e "$HOME/.local/bin/tetrisplus.exe"
